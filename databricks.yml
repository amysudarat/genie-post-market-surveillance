bundle:
  name: genie-post-market-surveillance

variables:
  catalog:
    description: Unity Catalog catalog for the demo schema
    default: workspace          # default catalog in Databricks Free Edition
  schema:
    description: Schema created for the demo
    default: pms_genie_cowork
  warehouse_id:
    description: SQL warehouse for the Genie agent. Leave empty to use the first warehouse in the workspace.
    default: ""

resources:
  jobs:
    pms_genie_setup:
      name: "[${bundle.target}] Post-market surveillance Genie demo - setup"
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: warehouse_id
          default: ${var.warehouse_id}
      tasks:
        - task_key: generate_structured_data
          notebook_task:
            notebook_path: ./notebooks/01_generate_structured_data.py
        - task_key: generate_capa_documents
          depends_on: [{ task_key: generate_structured_data }]
          notebook_task:
            notebook_path: ./notebooks/02_generate_capa_documents.py
        - task_key: extract_structure_from_text
          depends_on: [{ task_key: generate_capa_documents }]
          notebook_task:
            notebook_path: ./notebooks/03_extract_structure_from_text.py
        - task_key: gold_metrics_and_governance
          depends_on: [{ task_key: extract_structure_from_text }]
          notebook_task:
            notebook_path: ./notebooks/04_gold_metrics_and_governance.py
        - task_key: build_genie_agent
          depends_on: [{ task_key: gold_metrics_and_governance }]
          notebook_task:
            notebook_path: ./notebooks/05_build_genie_agent.py

targets:
  free:
    default: true
    mode: development

